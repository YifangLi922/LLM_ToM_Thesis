# Pilot 配置。这里只放模型名、参数和环境变量"名字"，绝不放 API key（key 在 .env 里）。
# 值为 null 的项表示"还没决定"，需要 capability check / 研究者确认后再填，不要凭空填写。

# 统一回答指令（guideline §1），所有 Q0/Q1/Q2/Q3 请求都使用同一句。
answer_instruction: "Answer with a number, one word, or a short phrase. Do not explain your answer."

# ---------------------------------------------------------------- 造题模型（OpenAI）
# 造题模型不得同时作为被测模型（加载配置时会自动检查）。
generator:
  provider: openai
  model_id: gpt-6.1-sol
  api_key_env: OPENAI_API_KEY
  access_verified: "2026-11-13: src/check_openai_access.py --structured 基本调用与 Structured Outputs 均通过"
  n_bundles_per_fact: 3       # propose_bundles 请求的 bundle 数量，可调整
  max_retries: 2
  max_output_tokens: 16000    # smoke test 的初始上限（推理型模型的思考也计入）；看实际用量后再调整
  temperature: null           # null = 模型默认

# ---------------------------------------------------------------- 抽样器（模板轮换 / 人物名字 / 限制二选一）
# 由代码分配而不是让造题模型自己挑（guideline §11）。分配是确定性的：同一个 seed 与 family 序号永远得到同一结果。
sampling:
  seed: 20261113
  # guideline 里的 6 个模板；每 6 个 family 各用一次，顺序由 seed 决定。
  templates: [T1, T2, T3, T4A, T4C, T5]
  # 人物名字池：10 男 10 女，每 20 个 family 各用一次。故事里的主人公必须使用被分配的名字。
  agent_names:
    male: [James, Daniel, Thomas, William, Henry, Samuel, Benjamin, Oliver, Michael, Andrew]
    female: [Emma, Sophie, Olivia, Hannah, Grace, Laura, Rachel, Chloe, Megan, Natalie]
  # 若故事正文里同时出现了 Q2 的两个竞争答案（即把"二选一"的选项写进了故事），
  # reject = 判为 error 并自动重新生成；warn = 只提示。
  binary_option_policy: reject
  max_regenerations: 2

# ---------------------------------------------------------------- 被测模型（OpenRouter）
eval_base_url: "https://openrouter.ai/api/v1"
evaluated_models:
  # thinking 的 true/false 对应 OpenRouter 的 reasoning 开关，具体传参方式待 capability check 实测确认。
  # pinned_provider：已固定后端服务商并关闭自动切换（2026-11-13 capability check：不固定时 GLM 会在 SiliconFlow/Z.AI/Novita 间切换）。
  # Qwen3-32B 固定 DeepInfra（fp8）；GLM-4.5-Air 固定 Novita（bf16，三家里精度最高）。实际服务商仍会写入 run_manifest。
  - condition_id: qwen3-32b__non_thinking
    provider: openrouter
    model_id: qwen/qwen3-32b
    thinking: false
    api_key_env: OPENROUTER_API_KEY
    pinned_provider: DeepInfra
    temperature: null
    max_tokens: null
    seed: null
  - condition_id: qwen3-32b__thinking
    provider: openrouter
    model_id: qwen/qwen3-32b
    thinking: true
    api_key_env: OPENROUTER_API_KEY
    pinned_provider: DeepInfra
    temperature: null
    max_tokens: null          # thinking 需要较大的上限，防止思考中途被截断
    seed: null
  - condition_id: glm-4.5-air__non_thinking
    provider: openrouter
    model_id: z-ai/glm-4.5-air
    thinking: false
    api_key_env: OPENROUTER_API_KEY
    pinned_provider: Novita
    temperature: null
    max_tokens: null
    seed: null
  - condition_id: glm-4.5-air__thinking
    provider: openrouter
    model_id: z-ai/glm-4.5-air
    thinking: true
    api_key_env: OPENROUTER_API_KEY
    pinned_provider: Novita
    temperature: null
    max_tokens: null
    seed: null
